<!doctype html>
<html lang="en">
  <head>
    <title>Taniti</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flex-column">
      <nav class="flex-row">
        <a href="#Explore">Explore</a
        ><a href="#Accommodations">Accommodations</a
        ><a href="#Touch">Get in Touch</a><a href="#FAQ">FAQ</a>
      </nav>
      <header>
        <div class="bg bg1"></div>
        <div class="bg bg2"></div>
        <div class="bg bg3"></div>
        <h1>Find Yourself in Taniti</h1>
      </header>
      <main>
        <div>
          <h2 id="Explore">Explore</h2>
          <div class="flex-row">
            <div class="card"><h3>Rainforest Hikes</h3></div>
            <div class="card"><h3>Active Volcano Tours</h3></div>
          </div>
        </div>
        <div>
          <h2 id="Accommodations">Accommodations</h2>
          <div class="flex-row">
            <div class="card"><h3>Private Homes & Condos</h3></div>
            <div class="card"><h3>Hotels</h3></div>
          </div>
        </div>
        <div>
          <h2 id="Touch">Get in touch with a travel agent</h2>
          <div class="card"><form>(todo)</form></div>
        </div>
        <div>
          <h2 id="FAQ">FAQ</h2>
          <div class="card">(todo)</div>
        </div>
      </main>
    </div>
  </body>
</html>
