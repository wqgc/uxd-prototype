<!doctype html>
<html lang="en">
  <head>
    <title>Taniti</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flex-column">
      <nav class="flex-row">
        <a href="#Explore">Explore</a
        ><a href="#Accommodations">Accommodations</a
        ><a href="#Touch">Get in Touch</a><a href="#FAQ">FAQ</a>
      </nav>
      <header>
        <div class="bg bg1"></div>
        <div class="bg bg2"></div>
        <div class="bg bg3"></div>
        <h1>Find Yourself in Taniti</h1>
      </header>
      <main>
        <div>
          <h2 id="Explore">Explore</h2>
          <div class="flex-row">
            <div class="card">
              <img src="imgs\vlad-hilitanu-pt7QzB4ZLWw-unsplash.jpg" />
              <h3>Rainforest Hikes</h3>
            </div>
            <div class="card">
              <img src="imgs\alain-bonnardeaux-tLxGw_ITs7k-unsplash.jpg" />
              <h3>Active Volcano Tours</h3>
            </div>
          </div>
        </div>
        <div>
          <h2 id="Accommodations">Accommodations</h2>
          <div class="flex-row">
            <div class="card">
              <img src="imgs\sandra-seitamaa-aerb5gwZ4vg-unsplash.jpg" />
              <h3>Private Homes & Condos</h3>
            </div>
            <div class="card">
              <img src="imgs\francesca-saraco-_dS27XGgRyQ-unsplash.jpg" />
              <h3>Hotels</h3>
            </div>
          </div>
        </div>
        <div>
          <h2 id="Touch">Get in touch with a travel agent</h2>
          <div class="card">
            <img src="imgs\camille-minouflet-d7M5Xramf8g-unsplash.jpg" />
            <form>(todo)</form>
          </div>
        </div>
        <div>
          <h2 id="FAQ">FAQ</h2>
          <div class="card">(todo)</div>
        </div>
      </main>
      <footer>
        <em>
          All images are from
          <a
            href="https://unsplash.com"
            target="_blank"
            rel="noopener noreferrer"
            >Unsplash</a
          >
          using its free license.</em
        >
      </footer>
    </div>
  </body>
</html>
